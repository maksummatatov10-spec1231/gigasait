<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GIGASAIT — Игры</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script src="../assets/js/device.js"></script>
  <link rel="stylesheet" href="../assets/css/hub.css">
  <style>
    .soon { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; animation: rise .8s var(--transition) both; }
    .soon .ic { font-size: 96px; filter: drop-shadow(0 0 30px #ff5c8a); margin-bottom: 20px; }
    .soon h1 { font-family: var(--font-display); font-size: clamp(36px,7vw,72px); letter-spacing:-2px; }
    .soon p { color: var(--text-2); font-size: 18px; margin: 14px 0 30px; max-width: 480px; }
    .soon .back { display:inline-flex; align-items:center; gap:8px; padding: 14px 24px; border-radius: 14px; background: #ff5c8a; color:#fff; font-weight:800; transition: var(--transition); }
    .soon .back:hover { transform: translateY(-2px); box-shadow: 0 12px 30px #ff5c8a66; }
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>
  <header class="hub-header">
    <a class="logo" href="../index.html"><span class="logo-mark">⚡</span><span class="logo-text">GIGA<span>SAIT</span></span></a>
    <div class="hub-actions">
      <button id="themeToggle" class="theme-switch" role="switch" aria-checked="false" title="Тема / Theme" aria-label="Theme">
        <span class="ts-track"><span class="ts-icon ts-moon">🌙</span><span class="ts-icon ts-sun">☀️</span><span class="ts-knob"></span></span>
      </button>
    </div>
  </header>
  <main class="soon">
    <div class="ic">🎮</div>
    <h1 id="t">Игры</h1>
    <p id="p">Мини-игры, рекорды и таблицы лидеров появятся здесь. Раздел развивается постепенно.</p>
    <a class="back" href="../index.html" id="b">← На главную</a>
  </main>
  <script>
    (function(){
      var T={"ru": ["Игры", "Мини-игры, рекорды и таблицы лидеров появятся здесь. Раздел развивается постепенно.", "← На главную", "Скоро"], "en": ["Games", "Mini-games, records and leaderboards will appear here. This section is being built gradually.", "← Back to hub", "Soon"], "uk": ["Ігри", "Міні-ігри, рекорди та таблиці лідерів з’являться тут. Розділ розвивається поступово.", "← На головну", "Незабаром"], "be": ["Гульні", "Міні-гульні, рэкорды і табліцы лідараў з’явяцца тут. Раздзел развіваецца паступова.", "← На галоўную", "Хутка"], "kk": ["Ойындар", "Шағын ойындар, рекордтар мен көшбасшылар кестесі осында пайда болады. Бөлім біртіндеп дамып жатыр.", "← Басты бетке", "Жақында"], "ky": ["Оюндар", "Мини-оюндар, рекорддор жана лидерлер таблицасы бул жерде пайда болот. Бөлүм акырындык менен өнүгүүдө.", "← Башкы бетке", "Жакында"], "uz": ["Oʻyinlar", "Mini-oʻyinlar, rekordlar va yetakchilar jadvali shu yerda paydo boʻladi. Boʻlim asta-sekin rivojlanmoqda.", "← Bosh sahifaga", "Tez orada"], "pl": ["Gry", "Mini-gry, rekordy i rankingi pojawią się tutaj. Sekcja rozwija się stopniowo.", "← Strona główna", "Wkrótce"], "de": ["Spiele", "Minispiele, Rekorde und Bestenlisten erscheinen hier. Der Bereich wird schrittweise aufgebaut.", "← Zur Startseite", "Bald"], "fr": ["Jeux", "Mini-jeux, records et classements apparaîtront ici. La section se développe progressivement.", "← Accueil", "Bientôt"], "es": ["Juegos", "Los minijuegos, récords y clasificaciones aparecerán aquí. La sección se desarrolla gradualmente.", "← Inicio", "Pronto"], "it": ["Giochi", "Mini-giochi, record e classifiche appariranno qui. La sezione è in sviluppo graduale.", "← Home", "Presto"], "tr": ["Oyunlar", "Mini oyunlar, rekorlar ve liderlik tabloları burada görünecek. Bölüm adım adım geliştiriliyor.", "← Ana sayfa", "Yakında"], "zh": ["游戏", "小游戏、纪录和排行榜将在这里出现。此板块正在逐步建设中。", "← 返回主页", "即将推出"], "ar": ["الألعاب", "ستظهر هنا الألعاب المصغّرة والأرقام القياسية ولوحات الصدارة. يتم تطوير هذا القسم تدريجيًا.", "← الصفحة الرئيسية", "قريبًا"]};
      var root=document.documentElement;
      function rd(k){var v=localStorage.getItem(k);if(v&&v[0]==='"'){try{v=JSON.parse(v)}catch(e){}}return v;}
      var t=rd('giga.theme'); root.setAttribute('data-theme', t==='light'?'light':'dark');
      var tb=document.getElementById('themeToggle'); tb.setAttribute('aria-checked', root.getAttribute('data-theme')==='light'); tb.onclick=function(){var n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);tb.setAttribute('aria-checked',n==='light');localStorage.setItem('giga.theme',n);};
      var l=rd('giga.lang');
      if(!l||!T[l]){var c=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'ru']);l='ru';for(var i=0;i<c.length;i++){var b=String(c[i]).toLowerCase().split(/[-_]/)[0];if(T[b]){l=b;break;}}}
      var d=T[l]; root.lang=l; root.dir=(l==='ar'?'rtl':'ltr');
      document.getElementById('t').textContent=d[0]; document.getElementById('p').textContent=d[1]; document.getElementById('b').textContent=d[2];
      document.title='GIGASAIT — '+d[0];
    })();
  </script>
</body>
</html>
