<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIGASAIT — Сообщество</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hub.css">
  <style>
    .soon { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; animation: rise .8s var(--transition) both; }
    .soon .ic { font-size: 96px; filter: drop-shadow(0 0 30px #2dd4bf); margin-bottom: 20px; }
    .soon h1 { font-family: var(--font-display); font-size: clamp(36px,7vw,72px); letter-spacing:-2px; }
    .soon p { color: var(--text-2); font-size: 18px; margin: 14px 0 30px; max-width: 480px; }
    .soon .back { display:inline-flex; align-items:center; gap:8px; padding: 14px 24px; border-radius: 14px; background: #2dd4bf; color:#fff; font-weight:800; transition: var(--transition); }
    .soon .back:hover { transform: translateY(-2px); box-shadow: 0 12px 30px #2dd4bf66; }
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>
  <header class="hub-header">
    <a class="logo" href="../index.html"><span class="logo-mark">⚡</span><span class="logo-text">GIGA<span>SAIT</span></span></a>
    <div class="hub-actions">
      <button id="themeToggle" class="icon-btn" title="Тема">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main class="soon">
    <div class="ic">💬</div>
    <h1 id="t">Сообщество</h1>
    <p id="p">Форум, чаты и профили появятся здесь. Раздел развивается постепенно.</p>
    <a class="back" href="../index.html" id="b">← На главную</a>
  </main>
  <script>
    (function(){
      var T={"ru": ["Сообщество", "Форум, чаты и профили появятся здесь. Раздел развивается постепенно.", "← На главную", "Скоро"], "en": ["Community", "Forum, chats and profiles will appear here. This section is being built gradually.", "← Back to hub", "Soon"], "uk": ["Спільнота", "Форум, чати та профілі з’являться тут. Розділ розвивається поступово.", "← На головну", "Незабаром"], "be": ["Супольнасць", "Форум, чаты і профілі з’явяцца тут. Раздзел развіваецца паступова.", "← На галоўную", "Хутка"], "kk": ["Қауымдастық", "Форум, чаттар мен профильдер осында пайда болады. Бөлім біртіндеп дамып жатыр.", "← Басты бетке", "Жақында"], "ky": ["Коомчулук", "Форум, чаттар жана профилдер бул жерде пайда болот. Бөлүм акырындык менен өнүгүүдө.", "← Башкы бетке", "Жакында"], "uz": ["Hamjamiyat", "Forum, chatlar va profillar shu yerda paydo boʻladi. Boʻlim asta-sekin rivojlanmoqda.", "← Bosh sahifaga", "Tez orada"], "pl": ["Społeczność", "Forum, czaty i profile pojawią się tutaj. Sekcja rozwija się stopniowo.", "← Strona główna", "Wkrótce"], "de": ["Community", "Forum, Chats und Profile erscheinen hier. Der Bereich wird schrittweise aufgebaut.", "← Zur Startseite", "Bald"], "fr": ["Communauté", "Forum, chats et profils apparaîtront ici. La section se développe progressivement.", "← Accueil", "Bientôt"], "es": ["Comunidad", "El foro, los chats y los perfiles aparecerán aquí. La sección se desarrolla gradualmente.", "← Inicio", "Pronto"], "it": ["Community", "Forum, chat e profili appariranno qui. La sezione è in sviluppo graduale.", "← Home", "Presto"], "tr": ["Topluluk", "Forum, sohbetler ve profiller burada görünecek. Bölüm adım adım geliştiriliyor.", "← Ana sayfa", "Yakında"], "zh": ["社区", "论坛、聊天和个人资料将在这里出现。此板块正在逐步建设中。", "← 返回主页", "即将推出"], "ar": ["المجتمع", "سيظهر هنا المنتدى والدردشات والملفات الشخصية. يتم تطوير هذا القسم تدريجيًا.", "← الصفحة الرئيسية", "قريبًا"]};
      var root=document.documentElement;
      function rd(k){var v=localStorage.getItem(k);if(v&&v[0]==='"'){try{v=JSON.parse(v)}catch(e){}}return v;}
      var t=rd('giga.theme'); root.setAttribute('data-theme', t==='light'?'light':'dark');
      document.getElementById('themeToggle').onclick=function(){var n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);localStorage.setItem('giga.theme',n);};
      var l=rd('giga.lang');
      if(!l||!T[l]){var c=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'ru']);l='ru';for(var i=0;i<c.length;i++){var b=String(c[i]).toLowerCase().split(/[-_]/)[0];if(T[b]){l=b;break;}}}
      var d=T[l]; root.lang=l; root.dir=(l==='ar'?'rtl':'ltr');
      document.getElementById('t').textContent=d[0]; document.getElementById('p').textContent=d[1]; document.getElementById('b').textContent=d[2];
      document.title='GIGASAIT — '+d[0];
    })();
  </script>
</body>
</html>
